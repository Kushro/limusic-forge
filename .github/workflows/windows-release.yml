name: Windows release binaries

# Builds and signs the Windows installers for a release that ALREADY EXISTS, attaches them to it,
# and adds the `windows-x86_64` entry to latest.json so Windows installs get auto-updates.
#
# `scripts/release.sh` on Fedora creates the GitHub release and its .rpm. Publishing it fires this
# workflow automatically — a few minutes later the Windows assets appear on the same release. Nobody
# boots Windows. The Linux AppImage is built the same way, by linux-release.yml.
#
# It can also be run by hand against an older tag to backfill:
#   Actions ▸ Windows release binaries ▸ Run workflow ▸ tag = v0.1.4
#
# Requires repo secrets (Settings ▸ Secrets and variables ▸ Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/limusic-forge.key (docs/RELEASING-FORK.md)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  empty string (the key has no password)
#   LASTFM_API_KEY / LASTFM_API_SECRET  Last.fm credentials (optional — warn-only if absent)
#   LIMUSIC_DISCORD_APP_ID              Discord application id (optional — Discord off if absent)
# Without the signing pair the bundler emits no .sig and this job fails loudly rather than
# shipping an unsignable update.

# DISPATCH ONLY, ON PURPOSE — do not add `release: published` back. Actions caches are ref-scoped,
# and a release-triggered run executes on the *tag* ref, so it can never read the cache any previous
# release wrote. This job was recompiling all of Rust from scratch every single time, 11m25s of a
# 15m run, while dutifully saving a 0.55 GB cache nothing would ever read. A dispatched run executes
# on master, so the cache is shared release to release; the checkout below still pins the build to
# the tag. scripts/release.sh dispatches both workflows.
# Consequence: publishing a release from the GitHub UI builds nothing. Use the script.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build Windows binaries for (e.g. v0.1.4)
        required: true
        type: string
      dry_run:
        description: Build and sign, but attach nothing to the release
        required: false
        default: false
        type: boolean

permissions:
  contents: write # upload assets onto the release

# Per-workflow, NOT shared with linux-release.yml any more: the two now run in parallel, and the
# only thing they contend for is latest.json, which the upload step merges with a read-back retry.
concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # libmpv comes from shinchiro's newest dev build, resolved at build time (see "Build the libmpv
  # import library"): those are daily builds and old releases get deleted, so a pinned URL 404s
  # within weeks.
  MPV_REPO: shinchiro/mpv-winbuild-cmake
  MPV_DIR: ${{ github.workspace }}\.libmpv

jobs:
  # Avrea or GitHub-hosted labels, per the RUNNER_PROVIDER repo variable (see runner.yml).
  runner:
    uses: ./.github/workflows/runner.yml

  build:
    needs: runner
    runs-on: ${{ needs.runner.outputs.windows }}
    # A healthy run is ~13 min, and ~20 on a cold cache. The default is six hours, which is what a
    # wedged download or a stuck installer build would burn while the release sits incomplete.
    timeout-minutes: 40
    steps:
      - name: Resolve the tag
        id: rel
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || { echo "::error::no tag to build for"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Dry runs only validate packaging, so trade runtime speed for build speed: 16 codegen units
      # instead of the profile's 1. Published releases keep `codegen-units = 1` (Cargo.toml). Set
      # before rust-cache, which keys on CARGO_* env, so dry-run artifacts never mix with release ones.
      - name: Dry run, faster codegen
        if: ${{ inputs.dry_run }}
        shell: bash
        run: echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"

      # Actions are pinned to commit SHAs, not tags: `@v4` and `@v2` are mutable refs. This job
      # holds TAURI_SIGNING_PRIVATE_KEY and produces the installers users auto-update to, so
      # nothing in it should be able to change under us. To bump one: read the SHA off the action's
      # release, update the pin and the trailing version comment together.
      # persist-credentials: false, because nothing after this step uses git and there is no reason to
      # leave a writable token in .git/config for the rest of the job to find.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.rel.outputs.tag }}
          persist-credentials: false

      # The tag is the contract: the binaries must be built from the source that tag points at, and
      # the updater compares tauri.conf.json's version. If they disagree, the version bump never got
      # committed — stop before shipping a mislabelled installer.
      #
      # A dry run is allowed to disagree, because that is the only way to test this workflow against
      # a branch instead of a published tag. Nothing is uploaded on a dry run, so a mislabelled
      # build cannot escape.
      - name: Check the tag matches the app version
        shell: bash
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Prerelease (beta channel only, RELEASING.md §8): drop build metadata (+…), take the suffix
          # after the FIRST '-', and it is one only if that suffix starts with rc, beta or alpha, any
          # case. Any other suffix is stable: the fork ships 1.2.0-forge.1 (and 1.2.0-forge.2-rc.1)
          # as Latest, so `*-*` is NOT the test. Body identical to is_prerelease in
          # scripts/release.sh and the other two workflows; same rule as isPrerelease in the app.
          is_prerelease() {
            local core="${1%%+*}"
            case "$core" in *-*) ;; *) return 1 ;; esac
            case "$(printf '%s' "${core#*-}" | tr '[:upper:]' '[:lower:]')" in rc*|beta*|alpha*) return 0 ;; *) return 1 ;; esac
          }
          if is_prerelease "$VERSION"; then echo "PRERELEASE=true"; else echo "PRERELEASE=false"; fi >> "$GITHUB_ENV"
          if [ "v$VERSION" != "${{ steps.rel.outputs.tag }}" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "::warning::dry run: built ref is ${{ steps.rel.outputs.tag }} but the app version is $VERSION"
            else
              echo "::error::tauri.conf.json says $VERSION but the tag is ${{ steps.rel.outputs.tag }}. Was the version bump committed before the tag was cut?"
              exit 1
            fi
          fi

      # Bake a snapshot of the community player-cipher registry into src-tauri/cipher_configs.json,
      # which is `include_str!`d into the binary. Nothing needing a deciphered stream URL plays
      # without a config for the current player.js, and the tracked file is deliberately empty —
      # the table is refreshed from these same registries at runtime.
      #
      # So this only covers the case where that refresh can't happen: a first run on a network that
      # blocks raw.githubusercontent.com. Without a snapshot that user has no cipher at all and
      # every restricted track is skipped. It goes stale within days either way, which is fine; the
      # runtime refresh is what keeps it current.
      #
      # NEVER FATAL. These registries are third-party. A release must not fail because one is down,
      # and shipping the empty table is exactly the behaviour we had before this step existed.
      - name: Bake in the player-cipher registry
        shell: bash
        run: |
          FARADAY=https://raw.githubusercontent.com/MetrolistGroup/faraday/master/registry/player_configs.json
          ZEMER=https://raw.githubusercontent.com/ZemerTeam/zemer-cipher/master/library/src/main/assets/player_configs.json
          tmp="$(mktemp)"
          for url in "$FARADAY" "$ZEMER"; do
            # Validate before overwriting: a 404 body or a half-written file must not replace a
            # good table with something the app will silently parse as empty.
            if curl -fsSL --max-time 30 "$url" -o "$tmp" \
               && jq -e '(.players | objects | length) > 0' "$tmp" >/dev/null 2>&1; then
              cp "$tmp" src-tauri/cipher_configs.json
              echo "bundled $(jq '.players | length' "$tmp") player configs from $url"
              exit 0
            fi
            echo "::warning::player-cipher registry unusable: $url"
          done
          echo "::warning::no player-cipher registry reachable — shipping the empty table; clients will fetch it at runtime"

      # pnpm before setup-node, so `cache: pnpm` below can find the binary and cache its store.
      # This step was 44s on Windows against 5s on Linux, all of it re-downloading the same
      # packages every release.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Frontend deps
        shell: bash
        run: cd ui && pnpm install --frozen-lockfile

      - name: Rust (MSVC)
        shell: bash
        run: rustup default stable-msvc

      # RUSTFLAGS is set HERE, before rust-cache, and never in a later step. The action hashes
      # RUSTFLAGS into its cache key, and cargo hashes it into every unit's fingerprint. Set it
      # after the action (or scoped to the build step, where it used to live) and the two disagree:
      # the key stays the same, so the action restores a target dir built with different flags,
      # cargo rejects every unit and rebuilds from scratch, and then the post step declines to save
      # the rebuilt artifacts because the key it restored was an exact match. The result is a full
      # cold compile on every single release, for ever. Keep this step above the cache.
      #
      # Three flags go in:
      #   -L native=…\.libmpv   the mpv.lib synthesised further down (link-time only; libmpv2-sys
      #                         ships pregenerated bindings and just emits `cargo:rustc-link-lib`)
      #   +crt-static           the whole C runtime (vcruntime AND the UCRT) linked statically, so
      #                         the exe imports no VCRUNTIME140*.dll, MSVCP140*.dll or
      #                         api-ms-win-crt-*.dll and starts on a machine without the VC++
      #                         redistributable. cc-built C deps (rquickjs-sys, sqlite) follow it to
      #                         /MT, and v8's prebuilt lib is /MT already. It must live here and not
      #                         in .cargo/config.toml: an RUSTFLAGS env var replaces the config's
      #                         rustflags outright, so a flag there would silently vanish in CI.
      #                         STATIC_VCRUNTIME=false goes with it: the Tauri CLI otherwise exports
      #                         STATIC_VCRUNTIME=true, and tauri-build's hybrid link then pulls the
      #                         UCRT back in as a DLL (/NODEFAULTLIB:libucrt.lib + ucrt.lib).
      #                         "Check the exe imports no C runtime DLL" below enforces the result.
      #   rust-lld              LLD instead of MSVC's link.exe. Cargo is the bulk of this job, and
      #                         with `codegen-units = 1` + thin LTO most of that is the codegen and
      #                         link of limusic-forge itself. The Linux job took its release build
      #                         from 6m56 to 3m33 by moving to mold; this is the same lever on the
      #                         platform that has no mold. rust-lld ships inside the toolchain, so
      #                         there is nothing to install and nothing to pin.
      #
      # The rust-lld half is a SOFT fallback on purpose: if rustup moves the binary, warn and build
      # with link.exe. A linker optimisation must never be the reason a release fails to build.
      - name: Resolve RUSTFLAGS (linker, libmpv link path, static CRT)
        shell: bash
        run: |
          set -euo pipefail
          FLAGS="-L native=${{ github.workspace }}\.libmpv -C target-feature=+crt-static"
          echo "STATIC_VCRUNTIME=false" >> "$GITHUB_ENV"
          SYSROOT="$(rustc --print sysroot | tr '\\' '/')"
          RUST_LLD="$SYSROOT/lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
          if [ -f "$RUST_LLD" ]; then
            FLAGS="$FLAGS -C linker-flavor=lld-link -C linker=$RUST_LLD"
            echo "linking with rust-lld ($RUST_LLD)"
          else
            echo "::warning::rust-lld not found at $RUST_LLD, falling back to MSVC link.exe"
          fi
          echo "RUSTFLAGS=$FLAGS" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=$FLAGS"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: Tauri CLI
        shell: bash
        # The npm CLI ships a prebuilt binary — `cargo install tauri-cli` would compile it from
        # source on every cache miss (~5 min for nothing).
        #
        # PINNED, like the actions. `^2` took 2.12.0 the day it was published and broke two legs at
        # once: its new linuxdeploy stopped bundling libgmp and libpipewire (the bundle check
        # caught it), and it stopped exporting STATIC_VCRUNTIME=true, which the locked tauri-build
        # 2.6.3 needed for its hybrid CRT link back when the C runtime was dynamic, so rquickjs-sys
        # no longer linked on Windows. The build is now fully static (+crt-static and
        # STATIC_VCRUNTIME=false, set with RUSTFLAGS above), which no longer leans on that export,
        # but the pin stays for linuxdeploy. Move it on purpose, with the tauri crates, and dry-run
        # all three legs before a release.
        run: npm install -g "@tauri-apps/cli@2.11.5"

      # libmpv is the whole reason Windows builds are a chore. The dev package ships the DLL and a
      # MinGW import lib (libmpv.dll.a) that the MSVC linker cannot consume, and no .def file — so
      # synthesise the .def from the DLL's own export table and build a real mpv.lib. The Rust side
      # just emits `cargo:rustc-link-lib=mpv` (pregenerated bindings, no headers needed).
      - name: Build the libmpv import library
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:MPV_DIR" | Out-Null
          # The newest release's baseline x86_64 dev package: `mpv-dev-x86_64-<date>-git-<sha>.7z`.
          # NOT the `-v3-` variant, which requires AVX2 and would crash on older CPUs. libmpv2 needs
          # mpv >= 0.35 (client API 2.x), which every current build is.
          $assets = gh api "repos/$env:MPV_REPO/releases/latest" --jq '.tag_name as $t | .assets[] | [$t, .name, .browser_download_url] | @tsv'
          if ($LASTEXITCODE -ne 0) { throw "could not read the latest $env:MPV_REPO release" }
          $pick = $assets | ForEach-Object { $tag, $name, $url = $_ -split "`t"; [pscustomobject]@{ tag = $tag; name = $name; url = $url } } |
            Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $pick) { throw "no baseline mpv-dev-x86_64 package in the latest $env:MPV_REPO release — did the asset names change?" }
          Write-Host "libmpv: $($pick.name) (release $($pick.tag))"
          curl.exe -fsSL -o "$env:MPV_DIR\mpv-dev.7z" "$($pick.url)"
          if ($LASTEXITCODE -ne 0) { throw "download failed: $($pick.url)" }
          7z x "$env:MPV_DIR\mpv-dev.7z" -o"$env:MPV_DIR" -y | Out-Null
          if (-not (Test-Path "$env:MPV_DIR\libmpv-2.dll")) { throw "libmpv-2.dll not found in $($pick.name) — did the dev package change shape?" }

          # dumpbin/lib live in the MSVC toolchain. (cargo itself finds MSVC on its own; this is
          # only so we can run the two tools.)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'

          Set-Location "$env:MPV_DIR"
          $names = & dumpbin /exports libmpv-2.dll |
            Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($names.Count -lt 50) { throw "parsed only $($names.Count) exports from libmpv-2.dll — dumpbin output format changed?" }
          @("EXPORTS") + ($names | ForEach-Object { "    $_" }) | Set-Content -Path mpv.def -Encoding ascii
          & lib /def:mpv.def /name:libmpv-2.dll /out:mpv.lib /machine:x64
          if (-not (Test-Path "$env:MPV_DIR\mpv.lib")) { throw "lib.exe did not produce mpv.lib" }
          Write-Host "mpv.lib built from $($names.Count) exports"

          # tauri.windows.conf.json lists libmpv-2.dll under bundle.resources, so the installer
          # places it next to the exe. Without this the app builds but won't start.
          Copy-Item "$env:MPV_DIR\libmpv-2.dll" "$env:GITHUB_WORKSPACE\src-tauri\libmpv-2.dll" -Force

      # The gitignored src-tauri/lastfm.keys (read by build.rs) obviously isn't in the checkout —
      # recreate it from repo secrets so Windows builds scrobble too. Missing secrets are a warning,
      # not a failure: the app is fully functional without Last.fm.
      - name: Last.fm API keys
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          if [ -n "$LASTFM_API_KEY" ] && [ -n "$LASTFM_API_SECRET" ]; then
            printf 'LIMUSIC_LASTFM_API_KEY=%s\nLIMUSIC_LASTFM_API_SECRET=%s\n' \
              "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > src-tauri/lastfm.keys
            echo "lastfm.keys written"
          else
            echo "::warning::LASTFM_API_KEY / LASTFM_API_SECRET secrets not set — this Windows build ships without Last.fm scrobbling"
          fi

      - name: Build + sign the installers
        shell: bash
        env:
          # Scoped to this step only — no other step (or third-party action) sees the signing key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Public Discord application id for rich presence, baked in by `option_env!` in
          # discord.rs. Optional: without it the build ships with Discord disabled.
          LIMUSIC_DISCORD_APP_ID: ${{ secrets.LIMUSIC_DISCORD_APP_ID }}
          # NOTE: RUSTFLAGS is deliberately NOT set here. It is exported to $GITHUB_ENV before
          # rust-cache runs, so the cache key and cargo's fingerprints agree. See that step.
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set — the build would produce unsignable installers"
            exit 1
          fi

          echo "building with RUSTFLAGS=${RUSTFLAGS:-<unset>}"
          (cd ui && pnpm build)
          # beforeBuildCommand emptied: we just ran it. Left on, tauri runs `pnpm build` from the
          # repo root, which has no package.json, so what pnpm builds there is down to the
          # filesystem rather than this job. Running it ourselves from ui/ keeps it deterministic.
          # NSIS only, for every version. The updater never uses the MSI, and WiX refuses a version
          # whose prerelease suffix isn't numeric, which -forge.1 and -rc.1 aren't (design D1).
          NSIS=target/release/bundle/nsis
          # A restored target/ could carry installers from an earlier run; the globs below must
          # only ever see this build's.
          rm -f "$NSIS"/*-setup.exe "$NSIS"/*-setup.exe.sig
          tauri build --bundles nsis --config '{"build":{"beforeBuildCommand":""}}'   # → $NSIS/

          # Tauri names the installer after productName, which has a space ("LiMusic Forge_…").
          # Ship a slug instead: limusic-forge_<version>_x64-setup.exe. Renamed BEFORE the second
          # pass below, which writes its installer to the very same path and would overwrite it.
          # The .sig signs the bytes, not the name, so it moves along unchanged.
          shopt -s nullglob
          found=("$NSIS"/*_"${VERSION}"_x64-setup.exe)
          [ "${#found[@]}" = 1 ] || { echo "::error::expected one *_${VERSION}_x64-setup.exe, found ${#found[@]}"; ls -la "$NSIS"; exit 1; }
          [ -f "${found[0]}.sig" ] || { echo "::error::no .sig next to ${found[0]} — signing key missing, or createUpdaterArtifacts got turned off"; exit 1; }
          SETUP="$NSIS/limusic-forge_${VERSION}_x64-setup.exe"
          if [ "${found[0]}" != "$SETUP" ]; then
            mv -f "${found[0]}" "$SETUP"
            mv -f "${found[0]}.sig" "$SETUP.sig"
          fi

          # Stage the portable zip's exe NOW, from the first pass: it is the exe inside the setup
          # above, and the import-table check below reads this copy too. The second pass only
          # re-bundles (it does not compile), but staging here keeps the zip independent of it.
          STAGE="target/release/bundle/portable/stage"
          rm -rf "${STAGE:?}" && mkdir -p "$STAGE/data"
          cp target/release/limusic-forge.exe "$STAGE/"

          # Second pass: the offline installer, WebView2 runtime embedded and installed silently, for
          # machines that cannot reach Microsoft's download (design D1). No updater artifacts: the
          # updater only ever downloads the online setup above.
          # `tauri bundle`, NOT `tauri build`: everything this pass changes is bundler-only config,
          # so it packages the exe the first pass already linked. `tauri build --config …` changed
          # TAURI_CONFIG, which reran tauri-build and recompiled the whole crate (~11.5 min) to
          # produce an identical exe. No --target/--features: the first pass used none either.
          # zlib, not the default lzma, for this installer only: it embeds the WebView2 runtime
          # installer (already compressed, well over 100 MB), which lzma spends minutes squeezing
          # for little gain. The online setup above (the one the updater downloads) keeps lzma.
          tauri bundle --bundles nsis --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false,"windows":{"webviewInstallMode":{"type":"offlineInstaller","silent":true},"nsis":{"compression":"zlib"}}}}'
          # The renamed online setup matches the same glob, so skip it.
          offline=()
          for f in "$NSIS"/*_"${VERSION}"_x64-setup.exe; do [ "$f" = "$SETUP" ] || offline+=("$f"); done
          [ "${#offline[@]}" = 1 ] || { echo "::error::second pass: expected one new *_${VERSION}_x64-setup.exe, found ${#offline[@]}"; ls -la "$NSIS"; exit 1; }
          OFFLINE="$NSIS/limusic-forge_${VERSION}_x64-offline-setup.exe"
          mv -f "${offline[0]}" "$OFFLINE"
          rm -f "${offline[0]}.sig"

          # Portable zip: the bare exe, libmpv, data\README.txt and the LICENSE. A `data` folder
          # next to the exe is what switches the app to portable mode (src-tauri/src/paths.rs), so
          # the README is also what makes the folder exist after extraction. Flat layout, no top
          # folder. No auto-update for this one: the README says to download the next zip.
          # $STAGE already holds the first-pass exe (staged before the second pass).
          cp src-tauri/libmpv-2.dll LICENSE "$STAGE/"
          cp assets/portable/README.txt "$STAGE/data/README.txt"
          PORTABLE="$PWD/target/release/bundle/portable/limusic-forge_${VERSION}_x64-portable.zip"
          rm -f "$PORTABLE"
          (cd "$STAGE" && 7z a -tzip -mx=5 "$PORTABLE" limusic-forge.exe libmpv-2.dll LICENSE data >/dev/null)
          7z l "$PORTABLE"
          ls -la "$NSIS" "$(dirname "$PORTABLE")"

      # The static CRT is only as good as the flags that reached every link, and nothing else in
      # this job would notice if one stopped (a Tauri CLI that forces STATIC_VCRUNTIME=true again,
      # a RUSTFLAGS override). The exe would still build and start here, where the VC++
      # redistributable is installed, and fail on a clean Windows. Read its import table instead.
      - name: Check the exe imports no C runtime DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'

          # Both exes that ship: the first-pass one (in the online setup and the portable zip), staged
          # by the build step, and the one in target/release, which is the exe inside the offline
          # setup. The second pass is `tauri bundle` and should not relink it, so the two are
          # expected to be the same file; checking both still catches it if that ever changes.
          $exes = @(
            "$env:GITHUB_WORKSPACE\target\release\bundle\portable\stage\limusic-forge.exe",
            "$env:GITHUB_WORKSPACE\target\release\limusic-forge.exe"
          )
          foreach ($exe in $exes) {
            if (-not (Test-Path $exe)) { throw "$exe not found — did mainBinaryName or the portable stage path change?" }
            Write-Host "$exe imports:"
            $deps = & dumpbin /dependents $exe | Select-String -Pattern '^\s+(\S+\.dll)\s*$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
            if ($deps.Count -lt 5) { throw "parsed only $($deps.Count) imports from $exe — dumpbin output format changed?" }
            $deps | ForEach-Object { Write-Host "  $_" }
            $crt = $deps | Where-Object { $_ -match '^(vcruntime140|msvcp140|api-ms-win-crt-|ucrtbase)' }
            if ($crt) { throw "$exe imports the C runtime dynamically: $($crt -join ', ') — check +crt-static and STATIC_VCRUNTIME" }
            Write-Host "no C runtime DLL imported by $exe"
          }

      - name: Dry run — built and signed, attaching nothing
        if: ${{ inputs.dry_run }}
        shell: bash
        run: echo "dry_run - build and signing succeeded; release assets left untouched."

      # Nothing in this job ever launches the app, so a dry run can prove the build succeeded and
      # not that the result starts. Hand the installer over as a workflow artifact instead: a
      # toolchain change (the linker above, the mpv import lib) can then be installed and clicked
      # before it goes anywhere near a real release. Artifacts are not release assets, so no user
      # sees this, and latest.json is untouched.
      - name: Dry run, keep the installer as an artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: limusic-forge-dry-run-${{ steps.rel.outputs.tag }}
          path: |
            target/release/bundle/nsis/limusic-forge_*-setup.exe
            target/release/bundle/nsis/limusic-forge_*.sig
            target/release/bundle/portable/limusic-forge_*-portable.zip
          if-no-files-found: error
          retention-days: 7

      - name: Attach installers + teach latest.json about Windows
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"

          # Every GitHub API call below goes through this. Without it a single transient failure
          # anywhere in this step aborts the job with the installers already uploaded and
          # latest.json un-merged, so Windows installs are never offered the update, and nothing
          # says so. All calls are idempotent (`--clobber` on upload, read-only download), so
          # retrying is safe.
          retry() { # retry <attempts> <command…>
            local n="$1"; shift
            local i
            for ((i = 1; i <= n; i++)); do
              "$@" && return 0
              # stderr, not stdout: `x="$(retry 3 gh api …)"` would otherwise capture this line.
              echo "::warning::attempt $i/$n failed: $*" >&2
              sleep $((i * 10))
            done
            return 1
          }
          fetch_manifest() { # fetch_manifest <dir>
            rm -rf "$1" && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$1"
          }
          # `gh release upload` has neither a timeout nor stall detection. When GitHub's asset
          # origin (uploads.github.com) degrades, gh sits there with no output and no bytes moving,
          # so the job hangs instead of failing and `retry` never gets its turn: v0.7.3 lost two
          # Linux runs that way on an AppImage that had gone up in 18 seconds the day before, and
          # the release sat half-published. It is not a size threshold. A probe that afternoon
          # wedged on a 10 MiB blob while a 420 byte .sig went straight through.
          #
          # curl can tell a stalled upload from a slow one, which is the whole point: --speed-limit
          # with --speed-time gives up once throughput has been under 32 KB/s for a minute, while an
          # upload that is merely slow (the Linux one that eventually landed averaged 610 KB/s) runs
          # to completion however long it takes. --max-time is the outer bound, for bytes that
          # trickle just above the stall limit forever.
          #
          # Files go up one at a time, the signed artifact before its .sig, so a failure part-way
          # cannot leave a .sig on the release beside a missing binary.
          upload() { # upload <file…>
            local f name id code state
            for f in "$@"; do
              # The API rewrites an asset name it does not like (a space becomes a dot) and stores
              # it under the rewritten one, so sending the basename verbatim would leave the lookup
              # below searching for a name that is not there and the re-upload answering 422.
              # Sanitising first means what we send is what gets stored, and it is already URL-safe.
              name="$(basename "$f")"; name="${name//[!A-Za-z0-9._-]/.}"
              # What --clobber used to do. A killed upload also leaves the asset in the "starter"
              # state, where it is listed with the right size, 404s on download, and blocks the name.
              id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
                    --jq ".[] | select(.name == \"$name\") | .id" | head -1)"
              if [ -n "$id" ]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" --silent || return 1
              fi
              code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --request POST --upload-file "$f" \
                --speed-limit 32768 --speed-time 60 --max-time 900 \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name")" \
                || { echo "::warning::$name: the upload stalled or the connection failed" >&2; return 1; }
              if [ "$code" != 201 ]; then
                echo "::warning::$name: the asset endpoint answered HTTP $code" >&2; return 1
              fi
              # 201 is not quite proof, and this is the failure that would not announce itself:
              # latest.json pointing at a "starter" asset is a release that looks complete here and
              # 404s for every updater. Returning 1 sends `retry` round again, which deletes it.
              state="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
                       --jq ".[] | select(.name == \"$name\") | .state" | head -1)"
              if [ "$state" != uploaded ]; then
                echo "::warning::$name: asset is in state '${state:-missing}', not 'uploaded'" >&2; return 1
              fi
              echo "uploaded $name"
            done
          }

          # The asset endpoint is addressed by release id; every other call here takes the tag.
          RELEASE_ID="$(retry 3 gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)"
          [ -n "$RELEASE_ID" ] || { echo "::error::no release found for $TAG"; exit 1; }

          # Names set by the build step. Three assets: the online setup (the only one in
          # latest.json, the updater installs it), the offline setup and the portable zip. No MSI.
          EXE="target/release/bundle/nsis/limusic-forge_${VERSION}_x64-setup.exe"
          SIG="$EXE.sig"
          OFFLINE="target/release/bundle/nsis/limusic-forge_${VERSION}_x64-offline-setup.exe"
          PORTABLE="target/release/bundle/portable/limusic-forge_${VERSION}_x64-portable.zip"

          for f in "$EXE" "$OFFLINE" "$PORTABLE"; do
            [ -f "$f" ] || { echo "::error::expected asset not found: $f"; find target/release/bundle -maxdepth 2; exit 1; }
          done
          if [ ! -f "$SIG" ]; then
            echo "::error::no .sig next to the installer — signing key missing, or createUpdaterArtifacts got turned off"; exit 1
          fi

          retry 5 upload "$EXE" "$SIG" "$OFFLINE" "$PORTABLE"

          # latest.json is the one thing both release workflows write, and they now run in parallel.
          # There is no compare-and-swap on release assets, so: merge, upload, read back, and retry
          # if the other job clobbered us in between. Whoever loses a round re-merges onto the
          # winner's copy, so it converges — normally on the first attempt, worst case the second.
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$EXE")"
          for attempt in 1 2 3 4 5; do
            retry 3 fetch_manifest manifest
            MANIFEST_VERSION="$(jq -r .version manifest/latest.json)"
            if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
              echo "::error::the release's latest.json is for $MANIFEST_VERSION but we built $VERSION"; exit 1
            fi
            jq --arg sig "$(cat "$SIG")" --arg url "$URL" \
              '.platforms["windows-x86_64"] = { signature: $sig, url: $url }' \
              manifest/latest.json > latest.json
            retry 3 upload latest.json

            sleep $((3 + RANDOM % 5))
            retry 3 fetch_manifest check
            if [ "$(jq -r '.platforms["windows-x86_64"].url // ""' check/latest.json)" = "$URL" ]; then
              echo "latest.json carries windows-x86_64 (attempt $attempt): $(jq -c '.platforms | keys' check/latest.json)"
              break
            fi
            [ "$attempt" -lt 5 ] || { echo "::error::windows-x86_64 kept getting clobbered out of latest.json"; exit 1; }
            echo "the Linux job clobbered the manifest, re-merging"
          done

          # Promote to "Latest" only once every platform is in the manifest.
          #
          # The updater resolves through /releases/latest/download/latest.json, so whatever is
          # Latest is what every installed client reads. This block runs identically at the end of
          # all three release workflows, and only the leg that finds all three keys present flips
          # the flag. Which leg that is depends on who finishes last, and it does not matter.
          #
          # Linux used to own this flip and checked only for its own key, which promoted incomplete
          # manifests two ways: for a few minutes while Windows or macOS was still building, since
          # Linux usually finishes first, and for good when one of them failed outright. v0.6.6 was
          # the second: the macOS leg failed, Linux marked the release Latest anyway, and every
          # Mac's update check read a manifest with no darwin-aarch64 entry.
          #
          # If a leg never finishes, nothing flips: /releases/latest/download/latest.json keeps
          # resolving to the previous, complete release until someone re-dispatches the failed
          # workflow. That is deliberate. It holds back the platforms that did build (v0.7.3's Linux
          # stall looked exactly like this, and still would), but no installed client ever reads a
          # manifest with no entry for its platform, and the release sitting un-Latest is visible.
          #
          # Duplicated verbatim in linux-release.yml, windows-release.yml and macos-release.yml on
          # purpose: a dispatched run takes the workflow from master but checks out the tag, so a
          # shared script or composite action would come from the tag and a re-dispatch against an
          # older one would not pick this up. Keep the three copies byte-identical.
          #
          # A release candidate (PRERELEASE=true: a -rc*, -beta* or -alpha* version, 1.1.0-rc.1) is
          # never Latest, so no stable install ever reads it. Any other suffix is stable: the fork
          # ships 1.2.0-forge.1 as Latest, with its latest.json at /releases/latest/download/. What it moves instead is the beta pointer: a permanent prerelease
          # tagged `beta` holding one latest.json, which installs on the beta channel read
          # (`check_beta_update` in commands.rs). A complete stable release moves the pointer too when
          # it is ahead of what the pointer holds, so beta installs land on 1.1.0 once it ships but
          # stay on 1.1.0-rc.2 through a 1.0.3 fix. The pointer never moves backwards here, so a
          # re-dispatch against an old tag cannot roll the beta channel back; that is done by hand
          # (RELEASING.md §8).
          REQUIRED_PLATFORMS='["darwin-aarch64","linux-x86_64","windows-x86_64"]'
          retry 3 fetch_manifest final
          HAVE="$(jq -c '.platforms | keys' final/latest.json)"
          if [ "$HAVE" != "$REQUIRED_PLATFORMS" ]; then
            echo "::notice::not promoting yet, latest.json carries $HAVE and needs $REQUIRED_PLATFORMS"
            exit 0
          fi
          if [ "$PRERELEASE" = true ]; then
            echo "$TAG is a release candidate: never Latest, beta channel only"
          else
            retry 3 gh release edit "$TAG" --latest --repo "$GITHUB_REPOSITORY"
            echo "All three platforms present, marked $TAG as Latest: $HAVE"
          fi

          # semver_gt A B: A ranks above B. x.y.z numerically, then a release above its own
          # prereleases, then prerelease suffixes by version sort. `sort -V` alone gets the middle
          # rule backwards (it puts 1.1.0-rc.1 after 1.1.0). Same function as scripts/release.sh.
          semver_gt() {
            [ "$1" != "$2" ] || return 1
            local a="${1%%-*}" b="${2%%-*}"
            if [ "$a" != "$b" ]; then
              [ "$(printf '%s\n%s\n' "$a" "$b" | sort -V | tail -1)" = "$a" ]
              return
            fi
            [ "$1" != "$a" ] || return 0
            [ "$2" != "$b" ] || return 1
            [ "$(printf '%s\n%s\n' "${1#*-}" "${2#*-}" | sort -V | tail -1)" = "${1#*-}" ]
          }
          # Created once by hand (RELEASING.md §8), and scripts/release.sh refuses to run without it.
          # An RC exists for the beta channel, so it fails without one; a stable release is complete
          # without it and only warns.
          if ! BETA_ID="$(retry 3 gh api "repos/$GITHUB_REPOSITORY/releases/tags/beta" --jq .id)"; then
            if [ "$PRERELEASE" = true ]; then
              echo "::error::no beta release to point at $TAG, so no install can get it. Create it (RELEASING.md §8) and re-dispatch"
              exit 1
            fi
            echo "::warning::no beta release, so the beta channel was not moved to $TAG"
            exit 0
          fi
          # Read the pointer through the asset list, so a transient error fails the step instead of
          # reading as "empty" and letting an older version overwrite a newer one.
          BETA_VERSION=""
          HAS_MANIFEST="$(retry 3 gh api "repos/$GITHUB_REPOSITORY/releases/$BETA_ID/assets" \
            --jq '[.[] | select(.name == "latest.json")] | length')"
          if [ "$HAS_MANIFEST" != 0 ]; then
            (TAG=beta; retry 3 fetch_manifest beta)
            BETA_VERSION="$(jq -r .version beta/latest.json)"
          fi
          if [ -z "$BETA_VERSION" ] || semver_gt "$VERSION" "$BETA_VERSION"; then
            (RELEASE_ID="$BETA_ID"; retry 3 upload final/latest.json)
            echo "beta channel moved to $VERSION (was ${BETA_VERSION:-empty})"
          else
            echo "beta channel stays on $BETA_VERSION, which is not behind $VERSION"
          fi
