name: Stream health

# Asks live YouTube, on demand (see `on:` below), whether this app can still resolve and stream a track.
#
# WHY THIS EXISTS: every playback breakage this project has had came from YouTube changing
# something, and every one of them was discovered by a user opening an issue. Two ANDROID_VR
# clients stopped streaming, the rustypipe safety net was capped at one mebibyte (issue #292), and
# the cipher registries go stale within hours of a player rotation. None of that is visible from
# the source, so nothing in `checks.yml` can catch it. This job asks the only authority there is.
#
# A RED RUN HERE IS USUALLY NOT A CODE REGRESSION. It means YouTube moved. Each assertion in
# `crates/innertube/tests/live_smoke.rs` says in its failure message which part of the chain went.
#
# THE TWO TESTS THAT ASK FOR AUDIO BYTES DO NOT RUN HERE, they run from a home connection via
# `scripts/stream-health-local.sh`. YouTube answers a GitHub runner's `/player` with UNPLAYABLE
# "Sign in to confirm you're not a bot", and rustypipe's resolve with the same sentence, because
# Actions runners sit in Azure ranges. Measured 2026-09-24 over three runs: the runner bootstraps a
# perfectly good visitorData (520 chars, same length as a working one here) and is refused anyway,
# so nothing in the code or the session can fix it. Skipping them is not a lowered bar: their
# verdict from a datacenter IP was never about YouTube, and a job that is red every night stops
# being read. What stays here is everything that answers the same from any IP, and the most
# valuable of those is the cipher registry check, which goes stale within hours of a rotation.
#
# NEVER BLOCKS A MERGE. There is no `pull_request` or `push` trigger on purpose: a third party's
# availability must not be able to stop work landing.
#
# ANONYMOUS ON PURPOSE. No `LIMUSIC_COOKIE` and no account secret, ever. The cookie-gated tests in
# the suite are `#[ignore]`d and self-skip without one. This repo is public and a nightly job
# holding a YouTube session cookie is a risk with no matching benefit.
#
# The runner comes from runner.yml's `linux` output (Avrea or GitHub-hosted, both Ubuntu 24.04).
# Unlike the release workflows the image version does not matter here: nothing is shipped from
# this job, so there is no glibc floor to protect, and `innertube` is pure Rust with no libmpv or
# WebKitGTK to install. Note the bot-challenge above was measured on GitHub's Azure runners; a run
# on Avrea may come from different IP ranges.

# MANUAL ONLY in the fork. The upstream nightly `schedule:` (04:00 UTC) is off: a fork's scheduled
# runs spend its Actions minutes and mail its owner about YouTube outages it does not triage.
# Run it from Actions ▸ Stream health ▸ Run workflow when playback looks broken.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-health
  cancel-in-progress: false

jobs:
  # Avrea or GitHub-hosted labels, per the RUNNER_PROVIDER repo variable (see runner.yml).
  runner:
    uses: ./.github/workflows/runner.yml

  live:
    needs: runner
    runs-on: ${{ needs.runner.outputs.linux }}
    timeout-minutes: 20
    steps:
      # `cargo test` compiles dependency build scripts, which run as this job. Without this
      # `actions/checkout` leaves GITHUB_TOKEN in `.git/config` for them to read. Nothing
      # here pushes, so the credential has no reason to stay.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # `-p innertube` only: the app crate links libmpv and WebKitGTK, and none of these tests
      # need it.
      #
      # `rustypipe_url_streams_to_the_end` is skipped: googlevideo serves only the first MiB of a
      # rustypipe URL (issue #292), so it fails every night, and a job that is always red gets
      # ignored. Run it by hand to see whether the cap has lifted; drop the skip when it passes,
      # or delete the test if the rustypipe fallback goes.
      #
      # `direct_clients_resolve_and_stream` and `rustypipe_url_is_fetchable` are skipped for the
      # reason in the header: they are bot-challenged from any runner IP. They are the two
      # `scripts/stream-health-local.sh` runs, so keep the two lists in step if either name moves.
      - name: Live extraction suite
        run: >-
          cargo test -p innertube --features integration-tests --
          --nocapture --skip rustypipe_url_streams_to_the_end
          --skip direct_clients_resolve_and_stream --skip rustypipe_url_is_fetchable

      - name: What a failure here means
        if: failure()
        run: |
          echo "::notice::A red run usually means YouTube changed something, not that a commit broke."
          echo "::notice::cipher_registries red: YouTube rotated player.js and the registries are behind."
          echo "::notice::Whether a track still streams is not answered here: scripts/stream-health-local.sh."
